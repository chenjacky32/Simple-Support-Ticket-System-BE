                  data:
                    type: object
                    properties:
                      id: { type: string, example: ULID_REPLY }
                      ticketId: { type: string, example: ULID_TIKET }
                      message: { type: string, example: "okayyy, we will fix it soon" }
                      createdAt: { type: string, example: '2025-01-01T00:00:00Z' }
                      createdBy:
                        type: object
                        properties:
                          name: { type: string, example: testing123 }
                          email: { type: string, example: example@example.com }
                          role: { type: string, example: USERS }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error401' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error403' } } } }
        '422': { description: Unprocessable Entity, content: { application/json: { schema: { $ref: '#/components/schemas/Error422' } } } }
        '404': { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/Error404' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error500' } } } }
  /api/v1/dashboard/stat:
    get:
      summary: Dashboard Stats
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          schema: { type: string, example: 2025-01-01 }
        - in: query
          name: endDate
          schema: { type: string, example: 2025-12-31 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: Fetch dashboard stats successfully }
                  data:
                    type: object
                    properties:
                      startDate: { type: string, example: 2025-01-01 }
                      endDate: { type: string, example: 2025-12-31 }
                      totalTickets: { type: integer, example: 100 }
                      openedTickets: { type: integer, example: 45 }
                      inprogressTickets: { type: integer, example: 25 }
                      resolvedTickets: { type: integer, example: 30 }
                      statusCompositions:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string, example: OPENED | INPROGRESS | RESOLVED }
                            percentage: { type: integer, example: 45 }
                            count: { type: integer, example: 45 }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error401' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error403' } } } }
        '500': { description: Internal Server Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error500' } } } }
